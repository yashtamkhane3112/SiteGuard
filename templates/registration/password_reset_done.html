{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset Email Sent | SiteGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <div class="auth-page-wrapper">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>

      <a href="{% url 'login' %}" class="back-to-home">
        <i class="bi bi-arrow-left"></i> Sign In
      </a>

      <div class="auth-container">
        <div class="text-center mb-4">
          <div class="auth-logo mb-2"><i data-lucide="activity"></i></div>
          <h5 class="auth-brand-name">SITE GUARD</h5>
        </div>

        <div class="auth-card text-center">
          <h4 class="text-white fw-bold mb-3">Check Your Inbox</h4>
          <p class="auth-footer-text mb-4">If that email address exists in SiteGuard, a password reset link has been sent.</p>
          <a href="{% url 'login' %}" class="btn-auth-primary w-100 text-decoration-none">Return to Sign In</a>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/script.js' %}"></script>
  </body>
</html>
