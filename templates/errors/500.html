{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Server Error | SiteGuard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    {% include "partials/favicon.html" %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body class="error-page-body">
    <section class="error-shell">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="container">
        <div class="error-card">
          <div class="error-eyebrow">500</div>
          <h1 class="error-title">SiteGuard hit an internal fault.</h1>
          <p class="error-copy">
            The request could not be completed right now. Retry in a moment or return to the dashboard.
          </p>
          <div class="error-actions">
            <a href="{% url 'index' %}" class="btn btn-primary-custom">Back Home</a>
            <a href="{% url 'dashboard' %}" class="btn btn-outline-light">Open Dashboard</a>
          </div>
        </div>
      </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/script.js' %}"></script>
  </body>
</html>
