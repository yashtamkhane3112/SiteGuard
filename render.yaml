services:
  - type: web
    name: siteguard-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash ./start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_SETTINGS_MODULE
        value: siteguard.settings.prod
      - key: DEBUG
        value: "False"
      - key: BOOTSTRAP_ADMIN_ENABLED
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_USE_SSL
        value: "False"
      - key: EMAIL_TIMEOUT
        value: "15"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SERVER_EMAIL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: EMAIL_SENDER_NAME
        value: SiteGuard Alerts
      - key: EMAIL_SUBJECT_PREFIX
        value: "[SiteGuard] "
      - key: SITE_NAME
        value: SiteGuard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: cron
    name: siteguard-monitor
    runtime: python
    plan: free
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: curl -fsS "$APP_BASE_URL/internal/run-monitoring/$CRON_SECRET/"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_SETTINGS_MODULE
        value: siteguard.settings.prod
      - key: DEBUG
        value: "False"
      - key: BOOTSTRAP_ADMIN_ENABLED
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_USE_SSL
        value: "False"
      - key: EMAIL_TIMEOUT
        value: "15"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SERVER_EMAIL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: EMAIL_SENDER_NAME
        value: SiteGuard Alerts
      - key: EMAIL_SUBJECT_PREFIX
        value: "[SiteGuard] "
      - key: SITE_NAME
        value: SiteGuard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
