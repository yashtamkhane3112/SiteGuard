services:
  - type: web
    name: siteguard-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash ./start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_SETTINGS_MODULE
        value: siteguard.settings.prod
      - key: DEBUG
        value: "False"
      - key: BOOTSTRAP_ADMIN_ENABLED
        value: "False"
      - key: DJANGO_BOOTSTRAP_ADMIN
        value: "False"
      - key: DJANGO_ADMIN_USERNAME
        sync: false
      - key: DJANGO_ADMIN_EMAIL
        sync: false
      - key: DJANGO_ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: EMAIL_BACKEND
        value: brevo_api
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_API_URL
        value: https://api.brevo.com/v3/smtp/email
      - key: EMAIL_TIMEOUT
        value: "15"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SERVER_EMAIL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: EMAIL_SENDER_NAME
        value: SiteGuard Alerts
      - key: EMAIL_SUBJECT_PREFIX
        value: "[SiteGuard] "
      - key: SITE_NAME
        value: SiteGuard
      - key: DATABASE_URL
        sync: false
      - key: SESSION_ENGINE
        value: django.contrib.sessions.backends.db
      - key: SESSION_COOKIE_AGE
        value: "1209600"
      - key: SESSION_SAVE_EVERY_REQUEST
        value: "True"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: AI_FEATURES_ENABLED
        value: "False"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: AI_REQUEST_TIMEOUT
        value: "20"
      - key: AI_MAX_TOKENS
        value: "900"
      - key: AI_RETRY_ATTEMPTS
        value: "2"
      - key: AI_RETRY_BACKOFF_SECONDS
        value: "0.5"

  - type: cron
    name: siteguard-monitor
    runtime: python
    plan: free
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: curl -fsS "$APP_BASE_URL/internal/run-monitoring/$CRON_SECRET/"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_SETTINGS_MODULE
        value: siteguard.settings.prod
      - key: DEBUG
        value: "False"
      - key: BOOTSTRAP_ADMIN_ENABLED
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: EMAIL_BACKEND
        value: brevo_api
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_API_URL
        value: https://api.brevo.com/v3/smtp/email
      - key: EMAIL_TIMEOUT
        value: "15"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SERVER_EMAIL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: EMAIL_SENDER_NAME
        value: SiteGuard Alerts
      - key: EMAIL_SUBJECT_PREFIX
        value: "[SiteGuard] "
      - key: SITE_NAME
        value: SiteGuard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
